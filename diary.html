<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8edeb; --surface:#f7f9f8; --raised:#ffffff;
  --ink:#17231f; --muted:#576661; --faint:#87958f;
  --line:#cfd8d4; --hover:#dbe4e0; --mark:#f6e7a6;
  --accent:#1c6a65; --accent-ink:#ffffff;
  --notes:#3e5060; --pos:#2a7a4a; --neg:#a5423a; --act:#2b5d8d;
  --ok:#2a7a4a; --warn:#b06a00; --warn-t:#f9ecd2; --danger:#b3261e;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1513; --surface:#151e1b; --raised:#1a2521;
    --ink:#e4ece8; --muted:#9aa8a2; --faint:#6b7873;
    --line:#2a3833; --hover:#22302b; --mark:#5a4d12;
    --accent:#62c2b9; --accent-ink:#052220;
    --notes:#aabdcc; --pos:#7bd39c; --neg:#f0948c; --act:#90bce7;
    --ok:#7bd39c; --warn:#f0b85a; --warn-t:#3a2c0e; --danger:#ff8a80;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar: data file status */
.bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.bar-dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.bar-dot.is-ok{background:var(--ok)}
.bar-dot.is-warn{background:var(--warn)}
.bar-dot.is-err{background:var(--danger)}
.bar-actions{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:5px 12px;font-size:13px;cursor:pointer;line-height:1.5}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.notice{max-width:1120px;margin:14px auto 0;padding:10px 14px;border-radius:8px;background:var(--warn-t);color:var(--ink);font-size:13.5px;border:1px solid var(--line);width:calc(100% - 40px)}

/* Layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;max-width:1120px;margin:20px auto 48px;padding:0 20px;align-items:start}
.page{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 32px 12px}
.side{position:sticky;top:64px}

/* Day header */
.day-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.day-title{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.15;letter-spacing:-.01em}
.day-rel{margin:4px 0 0;color:var(--muted);font-size:14px}
.day-nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nav-btn{border:1px solid var(--line);background:var(--raised);border-radius:7px;min-width:34px;height:34px;padding:0 10px;cursor:pointer;font-size:14px}
.nav-btn:hover{background:var(--hover)}
.nav-date{border:1px solid var(--line);background:var(--raised);border-radius:7px;height:34px;padding:0 8px;font-size:13px}

/* Entry sections */
.entry{margin:0 0 22px;padding-left:16px;border-left:3px solid var(--sec)}
.entry-notes{--sec:var(--notes)}
.entry-positive{--sec:var(--pos)}
.entry-negative{--sec:var(--neg)}
.entry-activities{--sec:var(--act)}
.entry-label{display:block;margin-bottom:6px;font-weight:600;font-size:14px;color:var(--sec)}
.entry-text{display:block;width:100%;min-height:112px;resize:vertical;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--raised);font-family:var(--serif);font-size:17px;line-height:1.65}
.entry-text::placeholder{color:var(--faint);font-style:italic}
.entry-text:focus{outline:none;border-color:var(--sec);box-shadow:0 0 0 1px var(--sec)}

/* Sidebar panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-title{font-family:var(--serif);font-size:20px;font-weight:500}
.cal-step{border:0;background:transparent;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:16px}
.cal-step:hover{background:var(--hover)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:12px;color:var(--faint);padding-bottom:4px}
.cal-day{position:relative;aspect-ratio:1;border:0;border-radius:8px;background:transparent;font-size:14px;cursor:pointer;padding:0}
.cal-day:hover{background:var(--hover)}
.cal-day.is-today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.is-sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal-day.has-entry::after{content:'';position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cal-day.is-sel.has-entry::after{background:var(--accent-ink)}
.cal-foot{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.find-input{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 10px;font-size:14px}
.find-title{margin:14px 0 6px;font-size:13px;color:var(--muted)}
.res{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer}
.res:hover{background:var(--hover)}
.res.is-sel{background:var(--hover)}
.res-date{display:block;font-size:14px;font-weight:500}
.res-snip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--muted)}
.res-snip mark{background:var(--mark);color:inherit;border-radius:2px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
.toast.is-on{opacity:1}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;margin-top:14px}
  .side{position:static}
  .page{padding:20px 18px 6px}
  .day-title{font-size:28px}
  .bar{padding:8px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .bar,.side,.day-nav,.notice{display:none!important}
  .layout{display:block;margin:0;padding:0}
  .page{border:0;padding:0;background:#fff}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-status"><span class="bar-dot" id="barDot"></span><span id="barText"></span></div>
  <div class="bar-actions">
    <button class="btn btn-primary" id="btnReconnect" type="button" hidden>Reconnect</button>
    <button class="btn" id="btnOpen" type="button">Open data file</button>
    <button class="btn" id="btnNew" type="button">New data file</button>
    <button class="btn" id="btnExport" type="button">Export backup</button>
    <button class="btn" id="btnImport" type="button">Import</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
</header>
<div class="notice" id="notice" hidden></div>

<main class="layout">
  <article class="page">
    <div class="day-head">
      <div>
        <h1 class="day-title" id="dayTitle"></h1>
        <p class="day-rel" id="dayRel"></p>
      </div>
      <div class="day-nav">
        <button class="nav-btn" id="btnPrev" type="button" aria-label="Previous day" title="Previous day (left arrow)">&#8249;</button>
        <button class="nav-btn" id="btnToday" type="button">Today</button>
        <button class="nav-btn" id="btnNext" type="button" aria-label="Next day" title="Next day (right arrow)">&#8250;</button>
        <input class="nav-date" id="datePick" type="date" aria-label="Jump to date">
        <button class="nav-btn" id="btnCopy" type="button" title="Copy this day so you can paste it into a OneNote page">Copy for OneNote</button>
      </div>
    </div>
    <div id="sections"></div>
  </article>

  <aside class="side">
    <section class="panel" aria-label="Calendar">
      <div class="cal-head">
        <button class="cal-step" id="calPrev" type="button" aria-label="Previous month">&#8249;</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-step" id="calNext" type="button" aria-label="Next month">&#8250;</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="cal-foot" id="calFoot"></p>
    </section>
    <section class="panel" aria-label="Search">
      <input class="find-input" id="search" type="search" placeholder="Search all entries" aria-label="Search all entries">
      <p class="find-title" id="resultsTitle"></p>
      <div id="results"></div>
    </section>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Constants and helpers ---------- */
var FIELDS=[
  {id:'notes',label:'General notes',hint:'What happened today? Anything worth remembering.'},
  {id:'positive',label:'Positive feelings',hint:'What felt good or went well?'},
  {id:'negative',label:'Negative feelings',hint:'What was hard, frustrating or worrying?'},
  {id:'activities',label:'Activities',hint:'What did you do today? One per line works well.'}
];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var MON_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var KEYRE=/^\d{4}-\d{2}-\d{2}$/;
var CACHE='diary-cache-v1';

function $(id){return document.getElementById(id);}
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function longDate(k){var d=parseKey(k);return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function shortDate(k){var d=parseKey(k);return DAYS_SHORT[d.getDay()]+' '+d.getDate()+' '+MON_SHORT[d.getMonth()]+' '+d.getFullYear();}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);}
function relLabel(k){
  var diff=Math.round((parseKey(k)-parseKey(keyOf(new Date())))/86400000);
  if(diff===0)return 'Today';
  if(diff===-1)return 'Yesterday';
  if(diff===1)return 'Tomorrow';
  return diff<0?(-diff)+' days ago':'In '+diff+' days';
}
function blank(){return {notes:'',positive:'',negative:'',activities:'',updated:''};}
function normEntry(x){
  var e=blank();
  FIELDS.forEach(function(f){e[f.id]=String((x&&x[f.id])||'');});
  e.updated=String((x&&x.updated)||'');
  return e;
}
function hasContent(e){return !!e&&FIELDS.some(function(f){return e[f.id].trim()!=='';});}
function timeStr(d){return d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'});}

/* ---------- State ---------- */
var state={
  entries:{},
  selected:keyOf(new Date()),
  view:null,
  handle:null,
  fs:('showOpenFilePicker' in window)&&('showSaveFilePicker' in window),
  dirty:false,saving:false,again:false,needPerm:false,err:'',
  rev:0,lastModified:0,lastSaved:null,search:''
};
(function(){var d=parseKey(state.selected);state.view={y:d.getFullYear(),m:d.getMonth()};})();
var saveTimer=null,sideTimer=null,toastTimer=null;

/* ---------- Local cache (safety net alongside the data file) ---------- */
function cacheSave(){try{localStorage.setItem(CACHE,JSON.stringify(state.entries));}catch(e){}}
function cacheLoad(){
  try{
    var t=localStorage.getItem(CACHE);
    if(!t)return;
    var o=JSON.parse(t);
    Object.keys(o).forEach(function(k){if(KEYRE.test(k))state.entries[k]=normEntry(o[k]);});
  }catch(e){}
}

/* ---------- Data merge and serialisation ---------- */
function mergeIn(data){
  var src=data&&data.entries;
  if(!src||typeof src!=='object')throw new Error('This file is not diary data.');
  var n=0;
  Object.keys(src).forEach(function(k){
    if(!KEYRE.test(k)||!src[k]||typeof src[k]!=='object')return;
    var inc=normEntry(src[k]),cur=state.entries[k];
    if(!cur||inc.updated>cur.updated){state.entries[k]=inc;n++;}
  });
  return n;
}
function localAhead(src){
  return Object.keys(state.entries).some(function(k){
    var r=src[k];
    return !r||String(r.updated||'')<state.entries[k].updated;
  });
}
function serialize(){
  var out={};
  Object.keys(state.entries).sort().forEach(function(k){out[k]=state.entries[k];});
  return {app:'diary',version:1,saved:new Date().toISOString(),entries:out};
}

/* ---------- IndexedDB (remembers the linked data file) ---------- */
function idb(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('diary-app',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
}
function idbGet(k){
  return idb().then(function(db){
    return new Promise(function(res,rej){
      var q=db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess=function(){res(q.result);};
      q.onerror=function(){rej(q.error);};
    });
  });
}
function idbSet(k,v){
  return idb().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction('kv','readwrite');
      tx.objectStore('kv').put(v,k);
      tx.oncomplete=function(){res();};
      tx.onerror=function(){rej(tx.error);};
    });
  });
}

/* ---------- Rendering ---------- */
function autosize(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}

function buildSections(){
  var host=$('sections');
  FIELDS.forEach(function(f){
    var sec=document.createElement('section');
    sec.className='entry entry-'+f.id;
    var lab=document.createElement('label');
    lab.className='entry-label';lab.htmlFor='f-'+f.id;lab.textContent=f.label;
    var ta=document.createElement('textarea');
    ta.id='f-'+f.id;ta.className='entry-text';ta.rows=4;ta.placeholder=f.hint;ta.lang='en-AU';
    ta.addEventListener('input',function(){onEdit(f.id,ta);});
    sec.appendChild(lab);sec.appendChild(ta);host.appendChild(sec);
  });
}

function renderDay(){
  var k=state.selected,e=state.entries[k]||blank();
  $('dayTitle').textContent=longDate(k);
  $('dayRel').textContent=relLabel(k);
  $('datePick').value=k;
  document.title='Diary \u2013 '+shortDate(k);
  FIELDS.forEach(function(f){
    var ta=$('f-'+f.id);
    if(ta.value!==e[f.id])ta.value=e[f.id];
    autosize(ta);
  });
}

function renderCal(){
  var y=state.view.y,m=state.view.m;
  $('calTitle').textContent=MONTHS[m]+' '+y;
  var grid=$('calGrid');grid.textContent='';
  ['M','T','W','T','F','S','S'].forEach(function(x){
    var s=document.createElement('span');s.className='cal-dow';s.textContent=x;s.setAttribute('aria-hidden','true');grid.appendChild(s);
  });
  var lead=(new Date(y,m,1).getDay()+6)%7;
  var n=new Date(y,m+1,0).getDate();
  var today=keyOf(new Date());
  for(var i=0;i<lead;i++)grid.appendChild(document.createElement('span'));
  for(var d=1;d<=n;d++){
    var k=y+'-'+pad(m+1)+'-'+pad(d);
    var has=hasContent(state.entries[k]);
    var b=document.createElement('button');
    b.type='button';
    b.className='cal-day'+(k===today?' is-today':'')+(k===state.selected?' is-sel':'')+(has?' has-entry':'');
    b.textContent=String(d);
    b.dataset.key=k;
    b.setAttribute('aria-label',longDate(k)+(has?', has an entry':''));
    if(k===state.selected)b.setAttribute('aria-current','date');
    grid.appendChild(b);
  }
  var total=Object.keys(state.entries).filter(function(k){return hasContent(state.entries[k]);}).length;
  $('calFoot').textContent=total===1?'1 day written':total+' days written';
}

function fillSnippet(node,e,q){
  var text='',idx=-1,i,f;
  if(q){
    for(i=0;i<FIELDS.length;i++){
      f=FIELDS[i];
      var at=e[f.id].toLowerCase().indexOf(q);
      if(at>=0){text=e[f.id];idx=at;break;}
    }
  }
  if(!text){
    for(i=0;i<FIELDS.length;i++){if(e[FIELDS[i].id].trim()){text=e[FIELDS[i].id];break;}}
  }
  var start=idx>40?idx-40:0;
  var piece=text.slice(start,start+120).replace(/\s+/g,' ').trim();
  if(start>0)piece='\u2026'+piece;
  if(text.length>start+120)piece+='\u2026';
  if(q){
    var li=piece.toLowerCase().indexOf(q);
    if(li>=0){
      node.appendChild(document.createTextNode(piece.slice(0,li)));
      var mk=document.createElement('mark');mk.textContent=piece.slice(li,li+q.length);
      node.appendChild(mk);
      node.appendChild(document.createTextNode(piece.slice(li+q.length)));
      return;
    }
  }
  node.textContent=piece;
}

function renderList(){
  var q=state.search.trim().toLowerCase();
  var host=$('results');host.textContent='';
  var keys=Object.keys(state.entries).filter(function(k){return hasContent(state.entries[k]);}).sort().reverse();
  var title;
  if(q){
    keys=keys.filter(function(k){return FIELDS.some(function(f){return state.entries[k][f.id].toLowerCase().indexOf(q)>=0;});});
    title=keys.length+(keys.length===1?' day matches':' days match');
    keys=keys.slice(0,50);
  }else{
    title=keys.length?'Recent entries':'No entries yet. Start writing today\u2019s page.';
    keys=keys.slice(0,8);
  }
  $('resultsTitle').textContent=title;
  keys.forEach(function(k){
    var b=document.createElement('button');
    b.type='button';b.className='res'+(k===state.selected?' is-sel':'');b.dataset.key=k;
    var d=document.createElement('span');d.className='res-date';d.textContent=shortDate(k);
    var s=document.createElement('span');s.className='res-snip';fillSnippet(s,state.entries[k],q);
    b.appendChild(d);b.appendChild(s);host.appendChild(b);
  });
}

function renderSide(){renderCal();renderList();}
function renderAll(){renderDay();renderSide();}
function scheduleSide(){clearTimeout(sideTimer);sideTimer=setTimeout(renderSide,400);}

function updateBar(){
  var dot=$('barDot'),txt=$('barText'),rec=$('btnReconnect'),note=$('notice');
  var cls='',msg='',name=state.handle?state.handle.name:'';
  rec.hidden=!(state.fs&&state.handle&&state.needPerm);
  $('btnOpen').hidden=!state.fs;
  $('btnNew').hidden=!state.fs;
  if(!state.fs){
    msg='This browser can\u2019t link a data file. Entries stay in this browser \u2013 use Export backup to keep a copy.';
  }else if(!state.handle){
    msg='No data file linked. Entries are stored in this browser only.';
  }else if(state.needPerm){
    cls='is-warn';msg=name+' \u2013 click Reconnect to allow saving.';
  }else if(state.err){
    cls='is-err';msg=name+' \u2013 '+state.err;
  }else if(state.saving){
    cls='is-warn';msg=name+' \u2013 saving\u2026';
  }else if(state.dirty){
    cls='is-warn';msg=name+' \u2013 unsaved changes';
  }else{
    cls='is-ok';msg=name+' \u2013 saved'+(state.lastSaved?' at '+timeStr(state.lastSaved):'');
  }
  dot.className='bar-dot '+cls;
  txt.textContent=msg;
  if(state.fs&&!state.handle){
    note.hidden=false;
    note.textContent='Your entries are stored in this browser only. Choose \u201cOpen data file\u201d or \u201cNew data file\u201d and pick a folder inside OneDrive (next to your OneNote notebook) so the diary is available on your other computers.';
  }else if(!state.fs){
    note.hidden=false;
    note.textContent='To save straight to a OneDrive file, open this page in Chrome or Edge on a computer. Elsewhere, use Export backup and Import to move entries between devices.';
  }else{
    note.hidden=true;
  }
}

/* ---------- Saving ---------- */
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200);}

async function flush(){
  clearTimeout(saveTimer);
  cacheSave();
  if(!state.handle||!state.dirty||state.needPerm){updateBar();return;}
  if(state.saving){state.again=true;return;}
  state.saving=true;state.err='';updateBar();
  var rev=state.rev;
  try{
    var perm=await state.handle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){state.needPerm=true;return;}
    var f=await state.handle.getFile();
    var text=await f.text();
    var merged=0;
    if(text.trim()){
      var data;
      try{data=JSON.parse(text);}
      catch(pe){throw new Error('The data file is not valid JSON, so it was left untouched.');}
      merged=mergeIn(data);
    }
    var w=await state.handle.createWritable();
    await w.write(JSON.stringify(serialize(),null,2));
    await w.close();
    var f2=await state.handle.getFile();
    state.lastModified=f2.lastModified;
    if(state.rev===rev)state.dirty=false;
    state.lastSaved=new Date();
    if(merged>0){cacheSave();renderAll();}
  }catch(e){
    state.err=(e&&e.message)?e.message:String(e);
  }finally{
    state.saving=false;
    updateBar();
    if(state.again){
      state.again=false;
      if(state.dirty&&!state.err&&!state.needPerm)flush();
    }
  }
}

function onEdit(field,ta){
  var k=state.selected;
  var e=state.entries[k];
  if(!e){e=blank();state.entries[k]=e;}
  e[field]=ta.value;
  e.updated=new Date().toISOString();
  state.rev++;state.dirty=true;state.err='';
  autosize(ta);
  cacheSave();updateBar();scheduleSave();scheduleSide();
}

/* ---------- Data file linking ---------- */
var PICKER_TYPES=[{description:'Diary data',accept:{'application/json':['.json']}}];

async function loadFromFile(){
  var f=await state.handle.getFile();
  var text=await f.text();
  state.lastModified=f.lastModified;
  var src={},empty=!text.trim();
  if(!empty){
    var data;
    try{data=JSON.parse(text);}
    catch(pe){throw new SyntaxError('The data file is not valid JSON, so it was left untouched.');}
    mergeIn(data);
    src=data.entries||{};
  }
  cacheSave();
  renderAll();
  if(empty||localAhead(src)||state.dirty){state.dirty=true;state.rev++;await flush();}
  else{state.lastSaved=new Date(f.lastModified);}
}

async function attach(h){
  var prev=state.handle;
  state.handle=h;state.needPerm=false;state.err='';
  try{
    await loadFromFile();
    await idbSet('handle',h);
  }catch(e){
    state.handle=prev;
    toast(e instanceof SyntaxError?'That file isn\u2019t diary data, so nothing was changed.':(e.message||'Could not open that file.'));
  }
  updateBar();
}

async function openFile(){
  try{
    var r=await window.showOpenFilePicker({types:PICKER_TYPES,multiple:false});
    await attach(r[0]);
  }catch(e){if(e&&e.name!=='AbortError')toast(e.message||'Could not open that file.');}
}
async function newFile(){
  try{
    var h=await window.showSaveFilePicker({suggestedName:'diary-data.json',types:PICKER_TYPES});
    await attach(h);
  }catch(e){if(e&&e.name!=='AbortError')toast(e.message||'Could not create that file.');}
}
async function reconnect(){
  try{
    var p=await state.handle.requestPermission({mode:'readwrite'});
    if(p==='granted'){state.needPerm=false;state.err='';await loadFromFile();}
  }catch(e){state.err=(e&&e.message)||String(e);}
  updateBar();
}

/* Pick up changes made on another computer (arrive via OneDrive sync) */
async function checkRemote(){
  try{
    var p=await state.handle.queryPermission({mode:'readwrite'});
    if(p!=='granted'){state.needPerm=true;updateBar();return;}
    var f=await state.handle.getFile();
    if(f.lastModified===state.lastModified)return;
    state.lastModified=f.lastModified;
    var t=await f.text();
    if(t.trim()&&mergeIn(JSON.parse(t))>0){cacheSave();renderAll();toast('Updated from the data file');}
  }catch(e){}
}
function tick(){
  if(!state.handle||state.saving||state.needPerm)return;
  if(state.dirty){flush();return;}
  checkRemote();
}

/* ---------- Export / import / copy ---------- */
function exportFile(){
  var blob=new Blob([JSON.stringify(serialize(),null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='diary-backup-'+keyOf(new Date())+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
async function importFile(file){
  if(!file)return;
  try{
    var data=JSON.parse(await file.text());
    var n=mergeIn(data);
    if(n>0){state.rev++;state.dirty=true;cacheSave();renderAll();scheduleSave();}
    toast(n>0?'Imported '+n+(n===1?' day':' days'):'Nothing new to import');
  }catch(e){toast('That file isn\u2019t diary data.');}
}
async function copyDay(){
  var k=state.selected,e=state.entries[k];
  if(!hasContent(e)){toast('Nothing written for this day yet');return;}
  var parts=FIELDS.filter(function(f){return e[f.id].trim();});
  var text=longDate(k)+'\n\n'+parts.map(function(f){return f.label+'\n'+e[f.id].trim();}).join('\n\n');
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var html='<h2>'+esc(longDate(k))+'</h2>'+parts.map(function(f){
    return '<h3>'+esc(f.label)+'</h3><p>'+esc(e[f.id].trim()).replace(/\n/g,'<br>')+'</p>';
  }).join('');
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob([text],{type:'text/plain'})
      })]);
    }else{
      await navigator.clipboard.writeText(text);
    }
    toast('Copied \u2013 paste it into a OneNote page');
  }catch(err){
    var t=document.createElement('textarea');
    t.value=text;t.style.position='fixed';t.style.opacity='0';
    document.body.appendChild(t);t.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(x){}
    t.remove();
    toast(ok?'Copied \u2013 paste it into a OneNote page':'Copy was blocked by the browser');
  }
}

function toast(msg){
  var t=$('toast');
  t.textContent=msg;t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('is-on');},3200);
}

/* ---------- Navigation ---------- */
function goTo(k){
  if(!KEYRE.test(k))return;
  state.selected=k;
  var d=parseKey(k);
  state.view={y:d.getFullYear(),m:d.getMonth()};
  renderAll();
}
function stepMonth(n){
  var d=new Date(state.view.y,state.view.m+n,1);
  state.view={y:d.getFullYear(),m:d.getMonth()};
  renderCal();
}

/* ---------- Wiring ---------- */
function wire(){
  $('btnPrev').addEventListener('click',function(){goTo(addDays(state.selected,-1));});
  $('btnNext').addEventListener('click',function(){goTo(addDays(state.selected,1));});
  $('btnToday').addEventListener('click',function(){goTo(keyOf(new Date()));});
  $('datePick').addEventListener('change',function(ev){if(ev.target.value)goTo(ev.target.value);});
  $('btnCopy').addEventListener('click',copyDay);
  $('calPrev').addEventListener('click',function(){stepMonth(-1);});
  $('calNext').addEventListener('click',function(){stepMonth(1);});
  $('calGrid').addEventListener('click',function(ev){var b=ev.target.closest('.cal-day');if(b)goTo(b.dataset.key);});
  $('results').addEventListener('click',function(ev){var b=ev.target.closest('.res');if(b)goTo(b.dataset.key);});
  $('search').addEventListener('input',function(ev){state.search=ev.target.value;renderList();});
  $('btnOpen').addEventListener('click',openFile);
  $('btnNew').addEventListener('click',newFile);
  $('btnReconnect').addEventListener('click',reconnect);
  $('btnExport').addEventListener('click',exportFile);
  $('btnImport').addEventListener('click',function(){$('fileImport').click();});
  $('fileImport').addEventListener('change',function(ev){importFile(ev.target.files[0]);ev.target.value='';});

  document.addEventListener('keydown',function(ev){
    if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();state.dirty=state.dirty||!!state.handle;flush();return;}
    if(document.activeElement===document.body&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){
      if(ev.key==='ArrowLeft')goTo(addDays(state.selected,-1));
      else if(ev.key==='ArrowRight')goTo(addDays(state.selected,1));
    }
  });
  window.addEventListener('focus',function(){renderSide();tick();});
  document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
  window.addEventListener('beforeunload',function(ev){
    if(state.dirty&&state.handle){flush();ev.preventDefault();ev.returnValue='';}
  });
  window.addEventListener('resize',function(){FIELDS.forEach(function(f){autosize($('f-'+f.id));});});
  if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(function(){FIELDS.forEach(function(f){autosize($('f-'+f.id));});});
  }
}

/* ---------- Start ---------- */
async function init(){
  buildSections();
  cacheLoad();
  wire();
  renderAll();
  updateBar();
  if(state.fs){
    try{
      var h=await idbGet('handle');
      if(h){
        state.handle=h;
        var p=await h.queryPermission({mode:'readwrite'});
        if(p==='granted')await loadFromFile();
        else state.needPerm=true;
      }
    }catch(e){
      state.err=(e&&e.message)||String(e);
    }
    updateBar();
  }
  setInterval(tick,30000);
}
init();
})();
</script>
